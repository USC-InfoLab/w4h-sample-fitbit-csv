vendor: fitbit
format: csv
version: "1.0.0"
title: Fitbit CSV sample package
description: Synthetic Fitbit-style CSV exports for W4H demos and importer tests.
importer_repo: https://github.com/USC-InfoLab/w4h-sample-fitbit-csv-importer

# Column-level `unit` and signal-level `sampling_interval` below are manifest
# documentation only — the importer forwards the full `columns` array to
# w4h-api's /import/csv-batch, but ensurePhysicalTable() only reads `name`
# and `type` off each column; unit/interval are not persisted to w4h.tables
# (which stores one `description` per signal/table, not per column). Treat
# these as human/tooling reference until a schema change adds real storage.
references:
  - title: Fitbit Web API — units & localization (Accept-Language)
    url: https://dev.fitbit.com/build/reference/web-api/developer-guide/application-design/
    note: >
      Weight/height/distance vary by Accept-Language (metric kg/cm/km,
      en_US lbs/in/mi, en_GB stone/cm/km); heart rate (bpm) and calories
      (kcal) are locale-independent. This sample assumes metric throughout.
  - title: Fitbit Web API — Intraday overview (detail-level resolutions)
    url: https://dev.fitbit.com/build/reference/web-api/intraday/
    note: >
      Intraday endpoints take a required detail-level query param
      (heart rate: 1sec/1min/5min/15min); this sample models 1min.
      Verify current allowed values per endpoint before scaling to real ingest.

signals:
  - slug: subjects
    file: data/fitbit_subjects.csv
    description: Subject enrollment window (study period per participant).
    fitbit_api_url: null
    columns:
      - name: id
        type: text
        description: Subject identifier (Fitbit-encoded user id in exports).
      - name: start_date
        type: date
        description: Start of data collection window for this subject.
      - name: end_date
        type: date
        description: End of data collection window for this subject.
    geomts_mapping:
      signal_type: subjects
      subject: id
      time: null
      values: []

  - slug: weight
    file: data/fitbit_weight.csv
    description: Body weight log from Fitbit Web API Get Weight Log.
    fitbit_api_url: https://dev.fitbit.com/build/reference/web-api/body/get-weight-log/
    columns:
      - name: id
        type: text
        description: Subject identifier.
      - name: date
        type: date
        description: Date of measurement.
      - name: time
        type: text
        description: Time of measurement (may include timezone).
      - name: weight
        type: double precision
        description: Weight in kilograms.
        unit: kg
      - name: bmi
        type: double precision
        description: Body mass index (weight_kg / height_m^2).
        unit: kg/m^2
      - name: fat_percent
        type: double precision
        description: Body fat percentage (optional in export).
        unit: percent
      - name: source
        type: text
        description: Data source label from Fitbit export.
    geomts_mapping:
      signal_type: weight
      subject: id
      time:
        combine: [date, time]
      values:
        - source: weight
          name: weight_kg
          type: double precision
          description: Weight in kilograms
        - source: bmi
          name: bmi
          type: double precision
          description: Body mass index
        - source: fat_percent
          name: fat_percent
          type: double precision
          description: Body fat percentage

  - slug: heart_rate
    file: data/fitbit_heart_rate.csv
    description: Intraday heart rate from Fitbit Web API Get Heart Rate Intraday Time Series.
    fitbit_api_url: https://dev.fitbit.com/build/reference/web-api/intraday/get-heartrate-intraday-by-date/
    sampling_interval: 1min
    columns:
      - name: id
        type: text
        description: Subject identifier.
      - name: date
        type: date
        description: Date of measurement.
      - name: timestamp
        type: text
        description: Time of measurement.
      - name: value
        type: integer
        description: Heart rate in beats per minute.
        unit: bpm
    geomts_mapping:
      signal_type: heart_rate
      subject: id
      time:
        combine: [date, timestamp]
      values:
        - source: value
          name: heart_rate_bpm
          type: integer
          description: Heart rate in beats per minute

  - slug: calories
    file: data/fitbit_calories.csv
    description: Intraday calories burned from Fitbit Web API Get Calories Intraday Time Series.
    fitbit_api_url: https://dev.fitbit.com/build/reference/web-api/intraday/get-calories-intraday-by-date/
    sampling_interval: 1min
    columns:
      - name: id
        type: text
        description: Subject identifier.
      - name: date
        type: date
        description: Date of measurement.
      - name: time
        type: text
        description: Time of measurement.
      - name: value
        type: double precision
        description: Calories burned.
        unit: kcal
      - name: mets
        type: integer
        description: Metabolic equivalent of task (METs), scaled by 10.
        unit: METs x10 (divide by 10 for true METs)
    geomts_mapping:
      signal_type: calories
      subject: id
      time:
        combine: [date, time]
      values:
        - source: value
          name: calories
          type: double precision
          description: Calories burned
        - source: mets
          name: mets
          type: integer
          description: Metabolic equivalent of task (METs), scaled by 10
